name: autofix.ci # needed to securely identify the workflow

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run autofix
        uses: area44/workflows/autofix@0f3c8ddac3da36482f8370597fd313a439f50dde # v10.1.0
