name: Release & Publish Package

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          install: true
          require-lockfile: true
          cache: true

      - name: Validate Biome configuration
        run: pnpm run check

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@a02a34c4d625f9be748b6d622b853ab796d589ed # v4.1.3
        with:
          release-type: node

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (
        github.event_name == 'release' ||
        needs.release-please.outputs.release_created == 'true'
      )
    steps:
      - name: Checkout tag or release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.release-please.outputs.tag_name }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          install: true
          require-lockfile: true
          cache: true

      - name: Validate release commit
        run: pnpm run check

      - name: Check if version is already published
        id: check-version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view "$PKG_NAME@$PKG_VERSION" version --json 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_NAME@$PKG_VERSION is already published to npm. Skipping publish step."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check-version.outputs.already_published != 'true'
        run: npm publish --provenance --access public
